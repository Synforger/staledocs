# staledocs applied to itself — the dogfood is the point.
version: 1
gate: strict

source:
  include: ["src/**"]
# Every tracked .md is in scope: staledocs owns path/anchor liveness
# (docs-check.sh keeps only template-convention axes).
docs:
  include: ["docs/**/*.md", "*.md", ".github/**/*.md"]
  exclude: []

pairs:
  - doc: docs/reference/README.md
    code: ["src/staledocs/**"]
  - doc: docs/agent-integration.md
    # chained pair: the reference is this page's upstream truth (exit codes, JSON contract)
    code: ["src/staledocs/report.py", "src/staledocs/cli.py", "src/staledocs/engine.py", "docs/reference/README.md"]
  - doc: docs/setup/README.md
    code: ["src/staledocs/cli.py", "src/staledocs/config.py"]

standalone:
  - docs/README.md
  - docs/troubleshooting/README.md
  - "docs/internals/**"
  - CONTRIBUTING.md
  - SECURITY.md
  - ROADMAP.md
  - THIRD_PARTY_NOTICES.md
  - ".github/**"

global:
  - README.md
  - README.ja.md

anchors:
  min_length: 3
  ignore:
    # config example quoted in the reference's anchors.ignore row
    - "research/*"
    # brace-expansion example quoted in the reference's resolution notes
    - "bridge/*.cjs"
    # prose-skip counterexample quoted in the reference's resolution notes
    - "src/gone"
    # git branch patterns quoted in docs/internals/branch-protection.md —
    # slash syntax without being repo paths
    - "*/[dm][ea][vi][!o]*"
    - "feature/main"
    - "hotfix/develop"
  include_fenced: false
